# Netlify builds the web app from the monorepo. `base` makes web/ the build root;
# everything below is what web/netlify.toml used to contain.
[build]
  base = "web"

# Use Netlify's Next.js runtime for proper SSR support
[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"
